<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باشگاه اعضا - معجزه ذهن</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="card">
    <h2>🧠 باشگاه اعضای معجزه ذهن</h2>
    <p id="userName">در حال دریافت اطلاعات...</p>
    
    <div class="balance-title">موجودی کیف پول:</div>
    <div class="balance" id="balance">۰ تومان</div>

    <button class="btn-topup" onclick="topupWallet()">💳 شارژ آنلاین کیف پول</button>
    <button class="btn-scan" onclick="startScanner()" style="margin-top: 10px;">📷 اسکن QR کد کافه / رستوران</button>
    
    <div id="reader"></div>
</div>

<script src="app.js"></script>
</body>
</html>
