<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیف پول اعضا - معجزه ذهن</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #eef2f5; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 380px; margin: 20px auto; }
        .balance { font-size: 26px; color: #2e7d32; font-weight: bold; margin: 15px 0; }
        button { background: #0288d1; color: white; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧠 باشگاه اعضای معجزه ذهن</h2>
    <p id="userName">در حال دریافت اطلاعات...</p>
    <div>موجودی کیف پول:</div>
    <div class="balance" id="balance">۰ تومان</div>

    <button onclick="startScanner()">📷 اسکن QR کد کافه / رستوران</button>
    
    <div id="reader"></div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    async function fetchUser() {
        try {
            const res = await fetch(`${API_URL}/api/user`);
            const data = await res.json();
            document.getElementById('userName').innerText = data.name;
            document.getElementById('balance').innerText = data.wallet_balance.toLocaleString() + " تومان";
        } catch (e) {
            document.getElementById('userName').innerText = "خطا در اتصال به سرور بک‌اند!";
        }
    }

    function startScanner() {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            async (qrCodeMessage) => {
                html5QrCode.stop();
                processPayment(qrCodeMessage);
            },
            () => {}
        );
    }

    async function processPayment(merchantCode) {
        const amount = prompt("مبلغ فاکتور را وارد کنید (تومان):", "50000");
        if (!amount) return;

        const res = await fetch(`${API_URL}/api/pay`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ merchant_code: merchantCode, amount: parseInt(amount) })
        });

        const result = await res.json();
        if (res.ok) {
            alert(result.message);
            document.getElementById('balance').innerText = result.new_balance.toLocaleString() + " تومان";
        } else {
            alert("خطا: " + result.detail);
        }
    }

    fetchUser();
</script>

</body>
</html>
